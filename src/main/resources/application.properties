spring.application.name=damm-logistics

# H2 Database
spring.datasource.url=jdbc:h2:mem:dammlogistics
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT
jwt.secret=DammLogisticsHackathon2026SecretKeyMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Google Maps API (set your key here)
google.maps.api.key=${GOOGLE_MAPS_API_KEY:YOUR_API_KEY_HERE}

# Truck defaults
truck.default.max-weight-kg=12000
truck.default.cargo-length-cm=700
truck.default.cargo-width-cm=240
truck.default.cargo-height-cm=240
truck.default.fuel-consumption-l-per-100km=30
truck.default.fuel-price-eur-per-l=1.65

# Pallet defaults (EUR pallet)
pallet.default.width-cm=80
pallet.default.length-cm=120
pallet.default.max-height-cm=150
pallet.default.max-weight-kg=1000

# Server
server.port=8080
